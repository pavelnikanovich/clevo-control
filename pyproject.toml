# Tool configuration only; the package is installed by the Makefile, not by pip.
[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["bin/clevoctl", "bin/clevo-control-tray"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["clevo_control", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["clevo_control"]

[[tool.mypy.overrides]]
module = ["gi", "gi.*"]
ignore_missing_imports = true
